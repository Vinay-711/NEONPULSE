name: Signal regression tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-signal-test.txt
      - run: python -m pip install -r requirements-signal-test.txt
      - run: python -m pytest tests/test_motion_signal.py -q
